<div class="login-page">
  <div class="login-card">

    <div class="logo">
      <img src="/taskflow-logo.png" alt="TaskFlow Logo">
    </div>

    <div class="welcome">
      <h1>Welcome back</h1>
      <p>Log in to pick up where you left off.</p>
    </div>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required>
      </div>

      <div class="form-group">
        <div class="password-heading">
          <label for="password">Password</label>
          <a href="#" (click)="forgotPassword($event)">Forgot password?</a>
        </div>

        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required>
      </div>

      <p class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <button type="submit" class="login-button">Log in</button>

      <div class="divider"><span>OR</span></div>

      <button type="button" class="google-button" (click)="googleLogin()">
        Continue with Google
      </button>

      <p class="signup-text">
        New to TaskFlow?
        <a href="#" (click)="createAccount($event)">Create account</a>
      </p>

    </form>
  </div>
</div>
